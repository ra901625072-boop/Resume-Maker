<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | WISAXIS Resume Maker</title>
    <!-- Design Tokens & Styles -->
    <link rel="stylesheet" href="/static/css/base/variables.css">
    <link rel="stylesheet" href="/static/css/base/reset.css">
    <link rel="stylesheet" href="/static/css/base/theme.css">
    <link rel="stylesheet" href="/static/css/base/effects.css">
    <link rel="stylesheet" href="/static/css/base/background.css">
    <link rel="stylesheet" href="/static/css/components/header.css">
    <link rel="stylesheet" href="/static/css/components/footer.css">
    <link rel="stylesheet" href="/static/css/components/buttons.css">
    <link rel="stylesheet" href="/static/css/components/modals.css">
    <link rel="stylesheet" href="/static/css/pages/auth.css">
    <link rel="stylesheet" href="/static/css/utilities/utilities.css">

    <!-- Core Scripts -->
    <script src="/static/js/config.js"></script>
    <script src="/static/js/core/auth-guard.js"></script>
    <script src="/static/js/core/api-client.js"></script>
    <script src="/static/js/core/theme-controller.js"></script>
</head>

<body class="auth-page">

    <!-- Global Animated Background -->
    <div class="global-bg" aria-hidden="true">
        <div class="bg-layer-base"></div>
        <div class="bg-layer-overlay"></div>
        <div class="bg-layer-gradient"></div>
        <div class="bg-layer-noise"></div>
        <div class="bg-layer-particles"></div>
    </div>

    <!-- Header -->
    <header class="app-header" role="banner">
        <div class="header-inner">
            <a href="/" class="brand" aria-label="Wisaxis Resume Maker Home">
                <img src="/static/images/brand/logo.png" alt="" class="brand-logo" width="34" height="34">
                <span class="brand-text">WISAXIS<span>Resume Maker</span></span>
            </a>

            <div class="header-actions-wrap">
                <button class="nav-icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" type="button">
                    <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="auth-wrapper" role="main">
        <div class="auth-card fade-up">
            <div class="auth-header">
                <div class="auth-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    <span>Get Started</span>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Build, customize, and export professional resumes in minutes</p>
            </div>

            <div id="authAlert" class="auth-alert" role="alert" aria-live="polite"></div>

            <form id="signupForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </span>
                        <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Akshay Rajput" required autocomplete="name" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </span>
                        <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Min. 8 characters" required autocomplete="new-password">
                        <button type="button" class="pw-toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
                            <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit" id="submitBtn">
                    <span>Create Account</span>
                </button>

                <div class="auth-footer">
                    Already have an account? <a href="/login.html" id="loginLink">Log in</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="app-footer" role="contentinfo" style="padding: 1.5rem 1rem; text-align: center;">
        <p style="margin: 0; color: var(--text-muted); font-size: var(--text-xs);">&copy; 2026 WISAXIS. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="/static/js/core/header-scroll.js"></script>
    <script src="/static/js/components/toast.js"></script>
    <script src="/static/js/core/global-effects.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signupForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm_password');
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('authAlert');
            const togglePwBtn = document.getElementById('togglePassword');
            const loginLink = document.getElementById('loginLink');

            // Preserve next query parameter in login link
            const urlParams = new URLSearchParams(window.location.search);
            const nextParam = urlParams.get('next');
            if (nextParam) {
                loginLink.href = `/login.html?next=${encodeURIComponent(nextParam)}`;
            }

            // Toggle password visibility
            togglePwBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                confirmPasswordInput.setAttribute('type', type);
            });

            function showAlert(message, type = 'error') {
                alertBox.textContent = message;
                alertBox.className = `auth-alert ${type}`;
                alertBox.style.display = 'flex';
            }

            function clearAlert() {
                alertBox.style.display = 'none';
                alertBox.textContent = '';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearAlert();

                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!name || name.length < 2) {
                    showAlert('Please enter your full name (at least 2 characters).');
                    return;
                }

                if (!email || !email.includes('@') || !email.includes('.')) {
                    showAlert('Please enter a valid email address.');
                    return;
                }

                if (!password || password.length < 8) {
                    showAlert('Password must be at least 8 characters long.');
                    return;
                }

                if (password !== confirmPassword) {
                    showAlert('Passwords do not match.');
                    return;
                }

                submitBtn.disabled = true;
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span>Creating account...</span>';

                try {
                    const response = await window.apiFetch('/api/auth/signup', {
                        method: 'POST',
                        body: {
                            name,
                            email,
                            password,
                            confirm_password: confirmPassword
                        }
                    });

                    const data = await response.json();

                    if (response.ok && data.success && data.token) {
                        showAlert('Account created! Redirecting...', 'success');
                        window.AuthGuard.setAuth(data.token, data.user);
                        if (window.showToast) window.showToast('Welcome to WISAXIS! 🚀', 'success');

                        setTimeout(() => {
                            const next = nextParam && nextParam.startsWith('/') ? nextParam : '/dashboard';
                            window.location.href = next;
                        }, 500);
                    } else {
                        showAlert(data.error || 'Failed to create account.');
                        if (window.showToast) window.showToast(data.error || 'Registration failed', 'error');
                    }
                } catch (err) {
                    showAlert('Unable to connect to the server. Please try again.');
                    if (window.showToast) window.showToast('Network error', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            });
        });
    </script>
</body>
</html>
