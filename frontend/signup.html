<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | WISAXIS Resume Maker</title>
    <meta name="description" content="Create a free WISAXIS account and start building your professional resume today.">

    <!-- 1. Design Tokens -->
    <link rel="stylesheet" href="/static/css/base/variables.css">
    <!-- 2. Reset -->
    <link rel="stylesheet" href="/static/css/base/reset.css">
    <!-- 3. Theme -->
    <link rel="stylesheet" href="/static/css/base/theme.css">
    <!-- 4. Effects -->
    <link rel="stylesheet" href="/static/css/base/effects.css">
    <!-- 4.1 Global Background -->
    <link rel="stylesheet" href="/static/css/base/background.css">
    <!-- 5. Header component -->
    <link rel="stylesheet" href="/static/css/components/header.css">
    <!-- 6. Auth page styles -->
    <link rel="stylesheet" href="/static/css/pages/auth.css">
    <!-- 7. Utilities -->
    <link rel="stylesheet" href="/static/css/utilities/utilities.css">

    <!-- Config & Auth Guard -->
    <script src="/static/js/config.js"></script>
    <script src="/static/js/core/auth-guard.js"></script>
    <script src="/static/js/core/theme-controller.js"></script>
</head>
<body class="auth-page guest-page">

    <!-- Global Background -->
    <div class="global-bg" aria-hidden="true">
        <div class="bg-layer-base"></div>
        <div class="bg-layer-overlay"></div>
        <div class="bg-layer-gradient"></div>
        <div class="bg-layer-noise"></div>
        <div class="bg-layer-particles"></div>
    </div>

    <!-- Minimal Header -->
    <header class="app-header" role="banner">
        <div class="header-inner">
            <a href="/" class="brand" aria-label="WISAXIS Resume Maker Home">
                <img src="/static/images/brand/logo.png" alt="" class="brand-logo" width="32" height="32">
                <span class="brand-text">WISAXIS <span>Resume Maker</span></span>
            </a>
            <div class="header-actions-wrap">
                <nav class="desktop-nav" aria-label="Authentication">
                    <a href="/login">Already a member? Login</a>
                </nav>
                <button class="nav-icon-btn" id="theme-toggle" aria-label="Toggle dark mode" type="button">
                    <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="auth-main" role="main">
        <div class="auth-card fade-up">
            <!-- Brand mark -->
            <div class="auth-brand">
                <div class="auth-logo-wrap">
                    <img src="/static/images/brand/logo.png" alt="" class="auth-logo">
                </div>
                <h1>Create your account</h1>
                <p class="auth-subtitle">Free forever. No credit card required.</p>
            </div>

            <!-- Trust badges -->
            <div class="auth-trust">
                <span class="auth-trust-badge">✓ 100% Free</span>
                <span class="auth-trust-badge">✓ 8+ Templates</span>
                <span class="auth-trust-badge">✓ ATS-Optimized</span>
            </div>

            <form novalidate class="auth-form" id="signupForm">
                <div class="auth-field">
                    <label for="name">Full Name</label>
                    <div class="auth-input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" id="name" name="name" class="auth-input" placeholder="John Doe" required autocomplete="name">
                    </div>
                </div>

                <div class="auth-field">
                    <label for="email">Email Address</label>
                    <div class="auth-input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" id="email" name="email" class="auth-input" placeholder="name@company.com" required autocomplete="email">
                    </div>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <div class="auth-input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <div class="auth-field">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="auth-input-wrap">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" id="confirm_password" name="confirm_password" class="auth-input" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="auth-submit" id="signupSubmitBtn">
                    <span class="btn-text">Create My Account — It's Free</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <p class="auth-footer">Already have an account? <a href="/login">Sign in here</a></p>
        </div>
    </main>

    <script src="/static/js/components/toast.js"></script>
    <script src="/static/js/core/header-scroll.js"></script>
    <script src="/static/js/core/global-effects.js"></script>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const btn = document.getElementById('signupSubmitBtn');
            
            if (!name || !email || !password || !confirm_password) {
                if (window.showToast) window.showToast('All fields are required.', 'error');
                return;
            }
            if (password !== confirm_password) {
                if (window.showToast) window.showToast('Passwords do not match.', 'error');
                return;
            }
            if (password.length < 8) {
                if (window.showToast) window.showToast('Password must be at least 8 characters.', 'error');
                return;
            }
            
            btn.disabled = true;
            try {
                const apiBase = window.API_BASE_URL || '';
                const res = await fetch(`${apiBase}/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ name, email, password, confirm_password })
                });
                
                const data = await res.json();
                if (res.ok && data.success) {
                    localStorage.setItem('wisaxis_logged_in', 'true');
                    localStorage.setItem('wisaxis_user_name', data.user.name);
                    if (window.showToast) window.showToast(`Account created! Welcome, ${data.user.name}! 🎉`, 'success');
                    const useHtmlExt = window.location.pathname.endsWith('.html') || window.location.protocol === 'file:';
                    setTimeout(() => {
                        window.location.href = useHtmlExt ? '/dashboard.html' : '/dashboard';
                    }, 800);
                } else {
                    if (window.showToast) window.showToast(data.error || 'Failed to create account.', 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                if (window.showToast) window.showToast('Network error, please try again.', 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
