<div class="resume-actions" data-shell-control>
    <div class="download-menu" data-shell-control>
        <button class="download-btn" id="downloadBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span class="btn-text">Download</span>
            <span class="btn-loader" style="display: none;" aria-hidden="true">
                <svg class="spin-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                </svg>
                Exporting...
            </span>
        </button>
        <div class="download-options">
            <button type="button" class="option" data-download-format="pdf">PDF</button>
            <a href="{{ url_for('resume.download_doc', resume_id=resume_id or request.view_args.get('resume_id')) }}" class="option">DOC</a>
        </div>
    </div>
</div>
