<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <!-- 1. Design Tokens -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/00-variables.css') }}">
    <!-- 2. Reset -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/01-reset.css') }}">
    <!-- 3. Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/02-theme.css') }}">
    <!-- 4. Effects -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/03-global-effects.css') }}">
    <!-- 4.1 Global Background -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/04-global-background.css') }}">
    <!-- 5. Header component -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/05-components/header.css') }}">
    <!-- 6. Auth page styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/07-pages/auth.css') }}">
    <!-- 7. Utilities -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/09-utilities.css') }}">

    <script src="/js/theme-controller.js"></script>
</head>
<body class="auth-page">
    {% include 'partials/global_bg.html' %}

    <div class="auth-card">
        <div class="auth-brand" style="margin-bottom: var(--space-4);">
            <h1 style="font-size: 5rem; font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: var(--space-2);">404</h1>
            <h2 style="font-size: var(--text-xl); font-weight: 800; color: var(--text-main); margin-bottom: var(--space-2);">Lost in Space?</h2>
            <p style="color: var(--text-muted); font-size: var(--text-sm); line-height: 1.6; max-width: 32ch; margin: 0 auto;">The page you are looking for does not exist or has been relocated.</p>
        </div>

        <a href="{{ url_for('main.home') }}" class="auth-submit" style="display: flex; align-items: center; justify-content: center; text-decoration: none; gap: var(--space-2); min-height: 52px; font-weight: 800;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Return Home</span>
        </a>
    </div>

    <script src="/js/toast.js"></script>
</body>
</html>
